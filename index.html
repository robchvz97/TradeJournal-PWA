<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b101a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TradeJournal">
  <title>TradeJournal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <style>
    :root {
      --bg: #0b101a;
      --card: #121a28;
      --line: #1e2a3d;
      --mint: #59ddb0;
      --red: #ff6b7a;
      --text: #e8eef7;
      --muted: #8b9bb3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    body { padding: 16px 16px calc(88px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
    .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .pos { color: var(--mint); }
    .neg { color: var(--red); }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .trade { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; }
    .thumb { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: #0b101a; border: 1px solid var(--line); }
    .thumb.empty { display: grid; place-items: center; color: var(--muted); font-size: 11px; }
    .sym { font-weight: 700; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    button, .btn {
      appearance: none; border: 0; background: var(--mint); color: #06261c;
      font-weight: 700; border-radius: 14px; padding: 12px 16px; font-size: 15px;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: #3a1520; color: var(--red); }
    .fab {
      position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom));
      width: 58px; height: 58px; border-radius: 50%; font-size: 28px; line-height: 1;
      box-shadow: 0 10px 24px #0008;
    }
    dialog { border: 0; padding: 0; background: transparent; width: min(100%, 560px); }
    dialog::backdrop { background: #000a; }
    .sheet { background: var(--card); border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
    form { display: grid; gap: 10px; }
    input, select, textarea {
      width: 100%; background: #0b101a; color: var(--text); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px; font-size: 16px;
    }
    textarea { min-height: 72px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; display: none; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
    .toolbar { display: flex; gap: 8px; margin: 8px 0 16px; }
    .toolbar button { flex: 1; font-size: 13px; }
  </style>
</head>
<body>
  <h1>TradeJournal</h1>
  <div class="sub">Tus operaciones. Tus fotos. Guardado en este dispositivo.</div>
  <div class="stats">
    <div class="card"><div class="label">Resultado neto</div><div class="value" id="net">0.00</div></div>
    <div class="card"><div class="label">Win rate</div><div class="value" id="wr">—</div></div>
    <div class="card"><div class="label">Cerradas</div><div class="value" id="count">0</div></div>
    <div class="card"><div class="label">Profit factor</div><div class="value" id="pf">—</div></div>
  </div>
  <div class="toolbar">
    <button class="ghost" id="exportBtn" type="button">Exportar</button>
    <button class="ghost" id="importBtn" type="button">Importar</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
  <div id="list" class="list"></div>
  <button class="fab" id="addBtn" type="button">+</button>

  <dialog id="modal">
    <div class="sheet">
      <h2 id="formTitle" style="margin-top:0">Nueva operación</h2>
      <form id="form">
        <input type="hidden" name="id">
        <div class="row">
          <input name="symbol" placeholder="Par · GBPJPY" required>
          <select name="side">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </div>
        <div class="row">
          <input name="volume" type="number" step="0.01" placeholder="Volumen" required>
          <input name="net" type="number" step="0.01" placeholder="Resultado (USD)" required>
        </div>
        <div class="row">
          <input name="entry" type="number" step="any" placeholder="Entrada">
          <input name="exit" type="number" step="any" placeholder="Salida">
        </div>
        <div class="row">
          <input name="opened" type="datetime-local">
          <input name="closed" type="datetime-local">
        </div>
        <textarea name="note" placeholder="Nota, setup, error…"></textarea>
        <input id="photo" type="file" accept="image/*">
        <img id="preview" class="preview" alt="">
        <div class="actions">
          <button type="submit">Guardar</button>
          <button type="button" class="ghost" id="cancelBtn">Cancelar</button>
        </div>
        <button type="button" class="danger" id="deleteBtn" hidden>Eliminar</button>
      </form>
    </div>
  </dialog>

  <script>
    const DB_NAME = 'tradejournal';
    const STORE = 'trades';
    let db, editing = null, photoData = null;

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function allTrades() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
        tx.onsuccess = () => resolve(tx.result.sort((a,b) => (b.closed || b.opened || '').localeCompare(a.closed || a.opened || '')));
        tx.onerror = () => reject(tx.error);
      });
    }
    function saveTrade(trade) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite').objectStore(STORE).put(trade);
        tx.onsuccess = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    function deleteTrade(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite').objectStore(STORE).delete(id);
        tx.onsuccess = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    function compress(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 900;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.src = url;
      });
    }
    function money(n) {
      const v = Number(n) || 0;
      return (v >= 0 ? '+' : '') + v.toFixed(2);
    }
    async function render() {
      const trades = await allTrades();
      const closed = trades.filter(t => t.net !== '' && t.net != null);
      const net = closed.reduce((s,t) => s + Number(t.net), 0);
      const wins = closed.filter(t => Number(t.net) > 0);
      const gain = wins.reduce((s,t) => s + Number(t.net), 0);
      const loss = -closed.filter(t => Number(t.net) < 0).reduce((s,t) => s + Number(t.net), 0);
      document.getElementById('net').textContent = money(net) + ' USD';
      document.getElementById('net').className = 'value ' + (net >= 0 ? 'pos' : 'neg');
      document.getElementById('count').textContent = closed.length;
      document.getElementById('wr').textContent = closed.length ? (100 * wins.length / closed.length).toFixed(1) + '%' : '—';
      document.getElementById('pf').textContent = loss ? (gain / loss).toFixed(2) : (gain ? '∞' : '—');
      const list = document.getElementById('list');
      if (!trades.length) {
        list.innerHTML = '<div class="empty">Aún no hay operaciones.<br>Pulsa + para agregar la primera.</div>';
        return;
      }
      list.innerHTML = trades.map(t => `
        <article class="card trade" data-id="${t.id}">
          ${t.photo ? `<img class="thumb" src="${t.photo}" alt="">` : `<div class="thumb empty">sin foto</div>`}
          <div>
            <div class="sym">${t.side} ${t.symbol}</div>
            <div class="meta">${t.volume || ''} · ${t.closed ? t.closed.replace('T',' ').slice(0,16) : 'sin cierre'}</div>
            <div class="meta">${t.note ? t.note.slice(0,80) : ''}</div>
          </div>
          <div class="value ${Number(t.net) >= 0 ? 'pos' : 'neg'}">${money(t.net)}</div>
        </article>
      `).join('');
      list.querySelectorAll('.trade').forEach(el => el.onclick = () => openForm(trades.find(t => t.id === el.dataset.id)));
    }
    function openForm(trade) {
      editing = trade || null;
      photoData = trade && trade.photo || null;
      const form = document.getElementById('form');
      form.reset();
      document.getElementById('formTitle').textContent = trade ? 'Editar operación' : 'Nueva operación';
      document.getElementById('deleteBtn').hidden = !trade;
      const preview = document.getElementById('preview');
      if (photoData) { preview.src = photoData; preview.style.display = 'block'; }
      else { preview.style.display = 'none'; preview.src = ''; }
      if (trade) {
        for (const [k,v] of Object.entries(trade)) {
          if (form.elements[k] && k !== 'photo') form.elements[k].value = v ?? '';
        }
      } else {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        form.elements.closed.value = now.toISOString().slice(0,16);
      }
      document.getElementById('modal').showModal();
    }
    document.getElementById('addBtn').onclick = () => openForm();
    document.getElementById('cancelBtn').onclick = () => document.getElementById('modal').close();
    document.getElementById('photo').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      photoData = await compress(file);
      const preview = document.getElementById('preview');
      preview.src = photoData;
      preview.style.display = 'block';
    };
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const trade = {
        id: f.id.value || crypto.randomUUID(),
        symbol: f.symbol.value.trim().toUpperCase(),
        side: f.side.value,
        volume: f.volume.value,
        net: f.net.value,
        entry: f.entry.value,
        exit: f.exit.value,
        opened: f.opened.value,
        closed: f.closed.value,
        note: f.note.value,
        photo: photoData
      };
      await saveTrade(trade);
      document.getElementById('modal').close();
      render();
    };
    document.getElementById('deleteBtn').onclick = async () => {
      if (!editing || !confirm('¿Eliminar esta operación?')) return;
      await deleteTrade(editing.id);
      document.getElementById('modal').close();
      render();
    };
    document.getElementById('exportBtn').onclick = async () => {
      const trades = await allTrades();
      const blob = new Blob([JSON.stringify(trades)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tradejournal-backup.json';
      a.click();
    };
    document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const trades = JSON.parse(await file.text());
      for (const t of trades) await saveTrade(t);
      render();
    };
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    openDb().then((d) => { db = d; render(); });
  </script>
</body>
</html>
